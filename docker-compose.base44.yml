# Base44 development environment for RetroPlayer.
# Single-origin wiring: the Vite dev server is the public entry point on host
# port 3000 and proxies /api and /auth to the backend service. This keeps the
# Spotify session cookie same-origin (no cross-site cookie gymnastics).
#
# Bring up:  docker compose -f docker-compose.base44.yml up -d --build
# Logs:     docker compose -f docker-compose.base44.yml logs -f
# Teardown: docker compose -f docker-compose.base44.yml down

services:
  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - path: ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      # Local infra / wiring values (NOT user secrets) — generated/derived.
      - PORT=3000
      - NODE_ENV=development
      # The public origin of the preview; the backend redirects here after OAuth
      # and uses it for CORS. Resolved from the platform suffix at runtime.
      - FRONTEND_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - SPOTIFY_REDIRECT_URI=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/auth/callback
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Where the Vite proxy forwards /api and /auth (the backend service).
      - BACKEND_URL=http://backend:3000
    ports:
      - "3000:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
